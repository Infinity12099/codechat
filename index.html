<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMS Chat Pro - Final</title>
    <style>
        :root { --bg-color: #f0f0f0; --chat-bg: white; --text-color: black; --received-msg: #e5e5ea; --input-bg: rgba(255,255,255,0.95); --border-color: #ddd; --header-bg: white; }
        body.dark-mode { --bg-color: #121212; --chat-bg: #1e1e1e; --text-color: #ffffff; --received-msg: #3a3a3c; --input-bg: rgba(30,30,30,0.95); --border-color: #333; --header-bg: #1e1e1e; }
        
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; width: 100%; position: fixed; background: var(--bg-color); color: var(--text-color); font-family: -apple-system, system-ui, sans-serif; }
        body { display: flex; flex-direction: column; }
        
        header { padding: 10px 15px; background: var(--header-bg); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 10; padding-top: env(safe-area-inset-top); }
        
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .sent { align-self: flex-end; }
        .received { align-self: flex-start; }
        
        .msg { padding: 8px 12px; border-radius: 18px; word-wrap: break-word; font-size: 15px; position: relative; }
        .sent .msg { background: #007aff; color: white; border-bottom-right-radius: 2px; }
        .received .msg { background: var(--received-msg); color: var(--text-color); border-bottom-left-radius: 2px; }
        
        .input-area { padding: 10px; background: var(--input-bg); border-top: 1px solid var(--border-color); display: flex; align-items: center; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        #message-input { flex: 1; padding: 10px 15px; border: 1px solid var(--border-color); border-radius: 20px; outline: none; background: var(--chat-bg); color: var(--text-color); font-size: 16px; margin: 0 8px; }
        
        #auth-overlay { position: fixed; inset: 0; background: var(--bg-color); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .auth-card { background: var(--chat-bg); padding: 30px; border-radius: 25px; width: 85%; max-width: 300px; display: flex; flex-direction: column; gap: 10px; text-align: center; }

        #send-btn { background: #007aff; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<header>
    <div style="width: 40px;"></div>
    <strong id="display-name">LÄDT...</strong>
    <button id="dark-btn" style="background:none; border:none; font-size:20px; cursor:pointer;">🌓</button>
</header>

<div id="auth-overlay">
    <div class="auth-card">
        <h2>Login</h2>
        <input type="text" id="auth-user" placeholder="Dein Name" style="padding:10px; border-radius:10px; border:1px solid #ddd;">
        <button id="login-submit" style="padding:12px; background:#007aff; color:white; border:none; border-radius:10px; font-weight:bold;">Chat starten</button>
    </div>
</div>

<div id="chat-window"></div>

<div class="input-area">
    <button id="img-btn" style="background:none; border:none; font-size:22px; cursor:pointer;">🖼️</button>
    <input type="text" id="message-input" placeholder="Nachricht..." autocomplete="off">
    <button id="send-btn">➔</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // DEINE KONFIGURATION
    const firebaseConfig = {
        apiKey: "AIzaSyCcXbYcAGOZN1hecccLLNMTIox-L_s-hXY",
        authDomain: "meinsmschat.firebaseapp.com",
        projectId: "meinsmschat",
        storageBucket: "meinsmschat.firebasestorage.app",
        messagingSenderId: "197306165640",
        appId: "1:197306165640:web:c3748c70a76a36056e723d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let myName = localStorage.getItem("chat-user-simple");

    // LOGIN LOGIK
    if (myName) {
        document.getElementById("auth-overlay").style.display = "none";
        document.getElementById("display-name").textContent = myName.toUpperCase();
        startChat();
    }

    document.getElementById("login-submit").onclick = () => {
        const n = document.getElementById("auth-user").value.trim();
        if(n) {
            localStorage.setItem("chat-user-simple", n);
            location.reload();
        }
    };

    // DARK MODE
    document.getElementById("dark-btn").onclick = () => {
        document.body.classList.toggle("dark-mode");
    };

    function startChat() {
        // NACHRICHTEN LADEN
        const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(50));
        onSnapshot(q, (snap) => {
            const win = document.getElementById("chat-window");
            win.innerHTML = "";
            let msgs = [];
            snap.forEach(doc => msgs.push(doc.data()));
            
            msgs.reverse().forEach(m => {
                const wrap = document.createElement("div");
                wrap.className = `msg-wrapper ${m.user === myName ? 'sent' : 'received'}`;
                
                const time = m.createdAt ? m.createdAt.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "...";
                
                wrap.innerHTML = `
                    <small style="font-size:10px; opacity:0.6; margin: 0 5px;">${m.user}</small>
                    <div class="msg">
                        ${m.imageUrl ? `<img src="${m.imageUrl}" style="max-width:100%; border-radius:10px; display:block; margin-bottom:5px;">` : ""}
                        ${m.text || ""}
                        <div style="font-size:9px; opacity:0.5; text-align:right; margin-top:3px;">${time}</div>
                    </div>
                `;
                win.appendChild(wrap);
            });
            win.scrollTop = win.scrollHeight;
        });
    }

    // NACHRICHT SENDEN
    async function sendMsg(text = "", url = "") {
        if (!text && !url) return;
        await addDoc(collection(db, "messages"), {
            text: text,
            imageUrl: url,
            user: myName,
            createdAt: serverTimestamp()
        });
        document.getElementById("message-input").value = "";
    }

    document.getElementById("send-btn").onclick = () => sendMsg(document.getElementById("message-input").value);
    document.getElementById("message-input").onkeydown = (e) => { if(e.key === "Enter") sendMsg(document.getElementById("message-input").value); };

    // BILD-LINK LOGIK (PLAN B)
    document.getElementById("img-btn").onclick = () => {
        const url = prompt("Kopiere hier den Bild-Link (URL) hinein:");
        if (url && (url.startsWith("http"))) {
            sendMsg("", url);
        } else if (url) {
            alert("Das ist kein gültiger Link!");
        }
    };
</script>
</body>
</html>
